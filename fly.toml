# fly.toml app configuration file generated for full-stack-open-pokedex-billowing-grass-6846 on 2025-01-20T16:09:22+02:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'full-stack-open-pokedex-billowing-grass-6846'
primary_region = 'arn'

[build]

[env]
  PORT = "3000" # add this where PORT matches the internal_port below

[processes]
  app = "node app.js" # add this

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  # Add health check configuration
  http_checks = [
    { path = "/health", interval = 10, timeout = 5, grace = 30 }
  ]

# Set deployment strategy to canary
[deploy]
  strategy = "canary"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
